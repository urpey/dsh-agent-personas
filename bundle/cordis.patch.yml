- insert:
    - id: persona-system
      name: '@local/dsh-persona-system'
      config:
        libraryDir: '.persona'
        groundingInterval: 0
        closingReflection: 'one-shot'
        providerName: 'persona'
        # auto: you rule the verdict per turn | always: every turn critical | never: every turn routine
        criticalGate: 'auto'
